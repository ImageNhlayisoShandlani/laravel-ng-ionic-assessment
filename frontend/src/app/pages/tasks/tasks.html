<div class="page-header">
  <div>
    <button mat-icon-button (click)="backToProjects()">
      <mat-icon>arrow_back</mat-icon>
    </button>
    <span class="project-title">{{ project()?.name ?? 'Loading...' }}</span>
  </div>
  <button mat-flat-button color="primary" (click)="openCreateDialog()">
    <mat-icon>add</mat-icon> New Task
  </button>
</div>

@if (loading()) {
  <p>Loading...</p>
} @else if (tasks().length === 0) {
  <p class="empty-state">No tasks yet — add one to get started.</p>
} @else {
  <table mat-table [dataSource]="tasks()" class="task-table">
    <ng-container matColumnDef="title">
      <th mat-header-cell *matHeaderCellDef>Title</th>
      <td mat-cell *matCellDef="let task">{{ task.title }}</td>
    </ng-container>

    <ng-container matColumnDef="status">
      <th mat-header-cell *matHeaderCellDef>Status</th>
      <td mat-cell *matCellDef="let task">
        <span class="status-chip" [ngClass]="statusColor(task.status)">{{ task.status }}</span>
      </td>
    </ng-container>

    <ng-container matColumnDef="due_date">
      <th mat-header-cell *matHeaderCellDef>Due Date</th>
      <td mat-cell *matCellDef="let task">{{ task.due_date || '—' }}</td>
    </ng-container>

    <ng-container matColumnDef="actions">
      <th mat-header-cell *matHeaderCellDef></th>
      <td mat-cell *matCellDef="let task">
        <button mat-icon-button (click)="openEditDialog(task)">
          <mat-icon>edit</mat-icon>
        </button>
        <button mat-icon-button color="warn" (click)="deleteTask(task)">
          <mat-icon>delete</mat-icon>
        </button>
      </td>
    </ng-container>

    <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
    <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
  </table>
}
