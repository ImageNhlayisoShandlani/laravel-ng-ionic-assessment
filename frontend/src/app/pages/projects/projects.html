<div class="page-header">
  <h1>Projects</h1>
  <button mat-flat-button color="primary" (click)="openCreateDialog()">
    <mat-icon>add</mat-icon> New Project
  </button>
</div>

@if (loading()) {
  <p>Loading...</p>
} @else if (projects().length === 0) {
  <p class="empty-state">No projects yet — create one to get started.</p>
} @else {
  <div class="project-grid">
    @for (project of projects(); track project.id) {
      <mat-card class="project-card" (click)="viewTasks(project)">
        <mat-card-header>
          <mat-card-title>{{ project.name }}</mat-card-title>
        </mat-card-header>
        <mat-card-content>
          <p>{{ project.description || 'No description' }}</p>
          <p class="task-count">{{ project.tasks?.length ?? 0 }} task(s)</p>
        </mat-card-content>
        <mat-card-actions align="end">
          <button mat-icon-button (click)="openEditDialog(project, $event)">
            <mat-icon>edit</mat-icon>
          </button>
          <button mat-icon-button color="warn" (click)="deleteProject(project, $event)">
            <mat-icon>delete</mat-icon>
          </button>
        </mat-card-actions>
      </mat-card>
    }
  </div>
}
